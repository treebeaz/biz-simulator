<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать комнату</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile-page">
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="/">Бизнес-симулятор</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto" id="navbarMenu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4" id="teacherRoomCreateRoot">
    <div id="message" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="hideMessage()"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-light"><h5 class="mb-0">Новая комната</h5></div>
        <div class="card-body">
            <div class="mb-3">
                <label for="roomNameInput" class="form-label">Название комнаты</label>
                <input id="roomNameInput" class="form-control" placeholder="Например: Кофейня А-1">
            </div>
            <div class="mb-3">
                <label for="roomBusinessTypeSelect" class="form-label">Тип бизнеса</label>
                <select id="roomBusinessTypeSelect" class="form-select">
                    <option value="COFFEE_SHOP" selected>COFFEE_SHOP</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="roomStartCashInput" class="form-label">Стартовый капитал</label>
                <input id="roomStartCashInput" type="number" class="form-control" min="1" step="0.01" placeholder="Например: 50000" value="50000">
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="button" onclick="createRoomByTeacher()">
                    <i class="bi bi-plus-circle"></i> Создать
                </button>
                <a class="btn btn-outline-secondary" href="/pages/teacher-rooms-list.html">К списку</a>
            </div>
            <div id="createdRoomInfo" class="small mt-3 d-none"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/index.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
