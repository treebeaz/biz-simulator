<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя группа</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile-page">
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="/">Бизнес-симулятор</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto" id="navbarMenu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div id="message" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="hideMessage()"></button>
    </div>

    <div id="studentGroupSection" class="card shadow-sm mb-4 d-none">
        <div class="card-header bg-light">
            <h5 class="mb-0">Моя группа</h5>
        </div>
        <div class="card-body">
            <div id="studentGroupInfo" class="mb-3 d-none">
                <div><strong>Группа:</strong> <span id="studentGroupName">—</span></div>
                <div><strong>Преподаватель:</strong> <span id="studentTeacherName">—</span></div>
                <div><strong>Email преподавателя:</strong> <span id="studentTeacherEmail">—</span></div>
            </div>

            <div id="studentClassmatesBlock" class="d-none">
                <hr>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">Одногруппники</h6>
                    <span id="studentClassmatesCount" class="badge bg-secondary">0</span>
                </div>
                <div id="studentClassmatesList"></div>
            </div>

            <hr>
            <div>
                <h6 class="mb-2">Симуляция</h6>
                <button class="btn btn-outline-primary" type="button" onclick="openStudentSimulation()">
                    <i class="bi bi-play-circle"></i> Перейти в симуляцию
                </button>
                <div class="small text-muted mt-2">Комната будет определена автоматически по вашему участию.</div>
            </div>

            <div id="studentJoinForm">
                <div class="mb-2">
                    <label for="joinCodeInput" class="form-label">Код приглашения</label>
                    <input type="text" id="joinCodeInput" class="form-control"
                           placeholder="Вставьте код от преподавателя">
                </div>
                <button type="button" class="btn btn-sm btn-primary" onclick="joinGroup()">
                    Присоединиться
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/index.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
