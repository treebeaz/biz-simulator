<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список комнат</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile-page">
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="/">Бизнес-симулятор</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto" id="navbarMenu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="hub-hero mb-4">
        <h2 class="mb-2">Комнаты</h2>
        <p class="mb-0 text-white-50">
            Здесь отображаются все комнаты текущего преподавателя. Можно быстро удалить лишнюю комнату и создать новую.
        </p>
    </div>

    <div id="message" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="hideMessage()"></button>
    </div>

    <div class="card hub-card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex gap-2 flex-wrap mb-3">
                <a class="btn btn-success btn-lg" href="/pages/teacher-rooms-create.html">
                    <i class="bi bi-plus-circle"></i> Создать комнату
                </a>
                <button type="button" class="btn btn-outline-primary btn-lg" onclick="loadTeacherRooms()">
                    <i class="bi bi-arrow-clockwise"></i> Обновить список
                </button>
            </div>

            <div id="teacherRoomsList">Загрузка комнат...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/index.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
