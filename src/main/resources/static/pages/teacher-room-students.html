<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Участники комнаты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile-page">
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="/">Бизнес-симулятор</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto" id="navbarMenu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4" id="roomStudentsPageRoot">
    <div class="hub-hero mb-4">
        <h2 class="mb-2" id="roomStudentsTitle">Участники комнаты</h2>
        <p class="mb-0 text-white-50" id="roomStudentsSubtitle">Загрузка...</p>
    </div>

    <div id="message" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="hideMessage()"></button>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3">
        <a class="btn btn-outline-secondary btn-lg" href="/pages/teacher-rooms-list.html">
            <i class="bi bi-arrow-left"></i> К списку комнат
        </a>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card hub-card shadow-sm h-100">
                <div class="card-body p-4">
                    <h6 class="mb-3">Добавить студента из группы</h6>
                    <p class="text-muted small mb-3">
                        В списке только студенты группы, к которой привязана эта комната. Уже добавленные в комнату не показываются.
                    </p>
                    <label for="addRoomStudentSelect" class="form-label">Студент</label>
                    <select id="addRoomStudentSelect" class="form-select form-select-lg mb-3"></select>
                    <button type="button" class="btn btn-primary btn-lg w-100" onclick="submitAddRoomStudent()">
                        <i class="bi bi-person-plus"></i> Добавить в комнату
                    </button>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card hub-card shadow-sm h-100">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0">Состав комнаты</h6>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="reloadRoomStudentsList()">
                            <i class="bi bi-arrow-clockwise"></i> Обновить
                        </button>
                    </div>
                    <div id="roomStudentsTableWrap">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/index.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
