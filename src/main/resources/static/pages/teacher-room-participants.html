<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Участники комнаты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile-page">
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="/">Бизнес-симулятор</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto" id="navbarMenu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4" id="teacherRoomParticipantsRoot">
    <div id="message" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="hideMessage()"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Участники комнаты</h4>
        <a class="btn btn-outline-secondary" href="/pages/teacher-rooms-list.html">К списку комнат</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-light">
                    <h6 class="mb-0">Студенты комнаты</h6>
                </div>
                <div class="card-body">
                    <div class="small text-muted mb-2">ID комнаты: <span id="roomParticipantsRoomId">—</span></div>
                    <div id="roomParticipantsContent">Загрузка...</div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">Аналитика студента</h6>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-sm btn-outline-secondary" type="button" onclick="downloadTeacherStudentCsv()" title="Скачать историю ходов в CSV">
                            <i class="bi bi-download"></i> CSV
                        </button>
                        <span class="small text-muted" id="teacherAnalyticsStudentName">Выберите студента слева</span>
                    </div>
                </div>
                <div class="card-body">
                    <div class="border rounded p-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div class="fw-semibold">Оценка преподавателя</div>
                            <span class="small text-muted" id="teacherGradeStatus">—</span>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label class="form-label small" for="teacherGradeValue">Оценка (0–100)</label>
                                <input id="teacherGradeValue" class="form-control form-control-sm" type="number" min="0" max="100" step="1" disabled>
                            </div>
                            <div class="col-md-9">
                                <label class="form-label small" for="teacherGradeComment">Комментарий</label>
                                <input id="teacherGradeComment" class="form-control form-control-sm" type="text" maxlength="500" placeholder="Короткий комментарий..." disabled>
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button class="btn btn-sm btn-primary" type="button" id="teacherGradeSaveBtn" onclick="saveTeacherGrade()" disabled>Сохранить</button>
                                <button class="btn btn-sm btn-outline-secondary" type="button" id="teacherGradeClearBtn" onclick="clearTeacherGradeForm()" disabled>Очистить</button>
                            </div>
                        </div>
                    </div>
                    <div id="teacherAnalyticsChartsEmpty" class="text-muted small">Графики появятся после выбора студента.</div>
                    <div id="teacherAnalyticsChartsWrap" class="d-none">
                        <div class="row g-3">
                            <div class="col-md-6"><canvas id="teacherChartCash"></canvas></div>
                            <div class="col-md-6"><canvas id="teacherChartProfit"></canvas></div>
                            <div class="col-md-6"><canvas id="teacherChartRevenueCost"></canvas></div>
                            <div class="col-md-6"><canvas id="teacherChartDemandSales"></canvas></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="accordion" id="teacherHistoryAccordion">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="teacherHistoryHeader">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#teacherHistoryCollapse" aria-expanded="false" aria-controls="teacherHistoryCollapse">
                            История ходов (таблица)
                        </button>
                    </h2>
                    <div id="teacherHistoryCollapse" class="accordion-collapse collapse" aria-labelledby="teacherHistoryHeader" data-bs-parent="#teacherHistoryAccordion">
                        <div class="accordion-body" id="teacherHistoryTableWrap">
                            Выберите студента.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/index.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
