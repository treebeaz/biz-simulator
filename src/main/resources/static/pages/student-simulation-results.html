<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты симуляции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile-page">
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="/">Бизнес-симулятор</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto" id="navbarMenu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4" id="studentSimulationResultsRoot">
    <div id="message" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="hideMessage()"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-0">Результаты игры</h4>
            <div class="small text-muted" id="studentResultsRoomInfo">—</div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" type="button" onclick="downloadStudentResultsCsv()">
                <i class="bi bi-download"></i> Скачать CSV
            </button>
            <button class="btn btn-outline-danger" type="button" onclick="restartSimulationFromResults()">
                <i class="bi bi-arrow-counterclockwise"></i> Начать новую игру
            </button>
        </div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 small" id="studentResultsSummaryWrap">Загрузка...</div>
        </div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h6 class="mb-0">Оценка преподавателя</h6>
            <span class="small text-muted" id="studentResultsGradeStatus">—</span>
        </div>
        <div class="card-body small" id="studentResultsGradeWrap">
            <span class="text-muted">Оценка появится после проверки преподавателем.</span>
        </div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-header bg-light"><h6 class="mb-0">Графики</h6></div>
        <div class="card-body">
            <div id="studentResultsChartsEmpty" class="text-muted small">Недостаточно данных для графиков.</div>
            <div id="studentResultsChartsWrap" class="d-none">
                <div class="row g-3">
                    <div class="col-md-6"><canvas id="studentChartCash"></canvas></div>
                    <div class="col-md-6"><canvas id="studentChartProfit"></canvas></div>
                    <div class="col-md-6"><canvas id="studentChartRevenueCost"></canvas></div>
                    <div class="col-md-6"><canvas id="studentChartDemandSales"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <div class="accordion" id="studentResultsHistoryAccordion">
        <div class="accordion-item">
            <h2 class="accordion-header" id="studentResultsHistoryHeader">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#studentResultsHistoryCollapse" aria-expanded="false" aria-controls="studentResultsHistoryCollapse">
                    Таблица истории ходов
                </button>
            </h2>
            <div id="studentResultsHistoryCollapse" class="accordion-collapse collapse" aria-labelledby="studentResultsHistoryHeader" data-bs-parent="#studentResultsHistoryAccordion">
                <div class="accordion-body" id="studentResultsHistoryTableWrap">
                    Нет данных.
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/index.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
