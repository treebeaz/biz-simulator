<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head(${pageTitle})}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
</head>

<body class="profile-page">
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/">Бизнес-симулятор</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/profile">Профиль</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="logout()">Выйти</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Мой профиль</h1>
        <div>
            <a href="/profile/edit" class="btn btn-primary">
                <i class="bi bi-pencil-square"></i> Редактировать
            </a>
        </div>
    </div>

    <div id="message" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="hideMessage()"></button>
    </div>

    <div class="row">
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div class="profile-icon">
                        <span id="profileInitials">👤</span>
                    </div>
                    <h4 id="profileName" class="mb-2">Загрузка...</h4>
                    <p class="text-muted mb-3" id="profileRole">Загрузка...</p>

                    <div class="d-grid gap-2">
                        <a href="/profile/edit" class="btn btn-outline-primary">
                            <i class="bi bi-gear"></i> Настройки профиля
                        </a>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="bi bi-house"></i> На главную
                        </a>
                    </div>
                </div>
            </div>

            
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Личная информация</h5>
                </div>
                <div class="card-body">
                    <div class="info-row">
                        <div class="row">
                            <div class="col-sm-4"><strong>Имя:</strong></div>
                            <div class="col-sm-8" id="profileFirstName">Загрузка...</div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="row">
                            <div class="col-sm-4"><strong>Фамилия:</strong></div>
                            <div class="col-sm-8" id="profileLastName">Загрузка...</div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="row">
                            <div class="col-sm-4"><strong>Логин:</strong></div>
                            <div class="col-sm-8" id="profileUsername">Загрузка...</div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="row">
                            <div class="col-sm-4"><strong>Email:</strong></div>
                            <div class="col-sm-8" id="profileEmail">Загрузка...</div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="row">
                            <div class="col-sm-4"><strong>Роль в системе:</strong></div>
                            <div class="col-sm-8" id="profileSystemRole">Загрузка...</div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<script src="/js/profile.js"></script>
</body>
</html>
