<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - Бизнес-симулятор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">Бизнес-симулятор</div>
                    <h2>Добро пожаловать!</h2>
                    <p>Войдите в свой аккаунт для продолжения</p>
                </div>

                <div class="login-body">
                    <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="errorText"></span>
                    </div>

                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="bi bi-person me-1"></i> Логин или Email
                            </label>
                            <div class="form-icon">
                                <i class="bi bi-person"></i>
                                <input type="text" id="username" name="username"
                                       class="form-control"
                                       placeholder="Введите логин или email"
                                       required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1"></i> Пароль
                            </label>
                            <div class="form-icon">
                                <i class="bi bi-lock"></i>
                                <input type="password" id="password" name="password"
                                       class="form-control"
                                       placeholder="Введите пароль"
                                       required>
                            </div>
                            <div class="form-text text-end">
                                <a href="#" class="small text-muted">Забыли пароль?</a>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login w-100 mb-4">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Войти в систему
                        </button>

                        <div class="divider">
                            <span>Нет аккаунта?</span>
                        </div>

                        <div class="text-center">
                            <a href="/auth/registration" class="register-link">
                                <i class="bi bi-person-plus me-1"></i> Создать новый аккаунт
                            </a>
                        </div>
                    </form>

                    <div class="alert alert-light border mt-4">
                        <h6 class="mb-2"><i class="bi bi-info-circle text-primary me-2"></i>Информация</h6>
                        <p class="small text-muted mb-0">
                            Войдите как студент для управления виртуальной компанией
                            или как преподаватель для создания учебных заданий.
                        </p>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-white small mb-0">
                    Бизнес-симулятор &copy; 2026
                    <span class="mx-2">•</span>
                    Дипломный проект
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/login-page.js"></script>
</body>
</html>
