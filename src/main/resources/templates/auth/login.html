<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - Бизнес-симулятор</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            border: none;
        }
        .login-header {
            background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-header h2 {
            margin-bottom: 10px;
            font-weight: 600;
        }
        .login-header p {
            opacity: 0.9;
            margin-bottom: 0;
        }
        .login-body {
            padding: 40px;
        }
        .form-icon {
            position: relative;
        }
        .form-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 18px;
        }
        .form-icon input {
            padding-left: 50px;
            height: 50px;
            border-radius: 10px;
            border: 2px solid #eef2ff;
            transition: all 0.3s;
        }
        .form-icon input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-label {
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .btn-login {
            background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%);
            border: none;
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(102, 126, 234, 0.2);
        }
        .register-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .register-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: #a0aec0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider span {
            padding: 0 15px;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="login-card">
                <!-- Заголовок -->
                <div class="login-header">
                    <div class="logo">Бизнес-симулятор</div>
                    <h2>Добро пожаловать!</h2>
                    <p>Войдите в свой аккаунт для продолжения</p>
                </div>

                <!-- Тело формы -->
                <div class="login-body">
                    <!-- Сообщения об ошибках -->
                    <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- Форма входа -->
                    <form id="loginForm">
                        <!-- Поле логина/email -->
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="bi bi-person me-1"></i> Логин или Email
                            </label>
                            <div class="form-icon">
                                <i class="bi bi-person"></i>
                                <input type="text" id="username" name="username"
                                       class="form-control"
                                       placeholder="Введите логин или email"
                                       required>
                            </div>
                        </div>

                        <!-- Поле пароля -->
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1"></i> Пароль
                            </label>
                            <div class="form-icon">
                                <i class="bi bi-lock"></i>
                                <input type="password" id="password" name="password"
                                       class="form-control"
                                       placeholder="Введите пароль"
                                       required>
                            </div>
                            <div class="form-text text-end">
                                <a href="#" class="small text-muted">Забыли пароль?</a>
                            </div>
                        </div>

                        <!-- Кнопка входа -->
                        <button type="submit" class="btn btn-login w-100 mb-4">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Войти в систему
                        </button>

                        <!-- Разделитель -->
                        <div class="divider">
                            <span>Нет аккаунта?</span>
                        </div>

                        <!-- Ссылка на регистрацию -->
                        <div class="text-center">
                            <a href="/auth/registration" class="register-link">
                                <i class="bi bi-person-plus me-1"></i> Создать новый аккаунт
                            </a>
                        </div>
                    </form>

                    <!-- Информация о системе -->
                    <div class="alert alert-light border mt-4">
                        <h6 class="mb-2"><i class="bi bi-info-circle text-primary me-2"></i>Информация</h6>
                        <p class="small text-muted mb-0">
                            Войдите как студент для управления виртуальной компанией
                            или как преподаватель для создания учебных заданий.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Дополнительная информация -->
            <div class="text-center mt-4">
                <p class="text-white small mb-0">
                    Бизнес-симулятор &copy; 2024
                    <span class="mx-2">•</span>
                    Дипломный проект
                </p>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Наши скрипты -->
<script src="/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Если уже авторизован - редирект
        if (isAuthenticated()) {
            window.location.href = "/";
        }

        // Автозаполнение имени пользователя из localStorage
        const savedUsername = localStorage.getItem('username');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('password').focus();
        }

        // Обработка формы
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Скрываем предыдущие ошибки
            errorMessage.classList.add('d-none');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Валидация
            if (!username.trim() || !password.trim()) {
                showError('Заполните все обязательные поля');
                return;
            }

            // Показываем индикатор загрузки
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Вход...';
            submitBtn.disabled = true;

            // Подготавливаем данные
            const isEmail = username.includes("@");
            const requestData = {
                password: password
            };

            if (isEmail) {
                requestData.email = username;
            } else {
                requestData.username = username;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Сохраняем данные пользователя
                    saveToken(data.token, data.username, data.role);

                    // Показываем успешное сообщение
                    submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i> Успешно!';
                    submitBtn.className = 'btn btn-success w-100 mb-4';

                    // Перенаправляем через 1 секунду
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);

                } else {
                    // Показываем ошибку
                    showError(data.message || 'Неверный логин или пароль');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }

            } catch (error) {
                showError('Ошибка сети или сервера');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                console.error('Ошибка входа:', error);
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('d-none');

            // Автоматически скрыть через 5 секунд
            setTimeout(() => {
                errorMessage.classList.add('d-none');
            }, 5000);
        }
    });
</script>
</body>
</html>
