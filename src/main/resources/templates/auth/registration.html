<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Бизнес-симулятор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/registration.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="register-card">
                <div class="register-header">
                    <div class="logo">Бизнес-симулятор</div>
                    <h2>Создание аккаунта</h2>
                    <p>Заполните данные, чтобы начать работу</p>
                </div>

                <div class="register-body">
                    <div id="errorMessage" class="alert alert-danger d-none"></div>
                    <div id="successMessage" class="alert alert-success d-none"></div>

                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="username" class="form-label">
                                    <i class="bi bi-at me-1"></i> Логин
                                </label>
                                <div class="form-icon">
                                    <i class="bi bi-person"></i>
                                    <input type="text" id="username" name="username" class="form-control" required>
                                </div>
                                <div class="form-text">Только буквы и цифры, минимум 5 символов</div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="email" class="form-label">
                                    <i class="bi bi-envelope me-1"></i> Email
                                </label>
                                <div class="form-icon">
                                    <i class="bi bi-envelope"></i>
                                    <input type="email" id="email" name="email" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="firstName" class="form-label">
                                    <i class="bi bi-person-badge me-1"></i> Имя
                                </label>
                                <div class="form-icon">
                                    <i class="bi bi-person"></i>
                                    <input type="text" id="firstName" name="firstName" class="form-control" required>
                                </div>
                                <div class="form-text">Начинается с заглавной буквы</div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="lastName" class="form-label">
                                    <i class="bi bi-person-badge-fill me-1"></i> Фамилия
                                </label>
                                <div class="form-icon">
                                    <i class="bi bi-person"></i>
                                    <input type="text" id="lastName" name="lastName" class="form-control" required>
                                </div>
                                <div class="form-text">Начинается с заглавной буквы</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="birthDate" class="form-label">
                                <i class="bi bi-calendar-event me-1"></i> Дата рождения
                            </label>
                            <div class="form-icon">
                                <i class="bi bi-calendar"></i>
                                <input type="date" id="birthDate" name="birthDate" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                <i class="bi bi-award me-1"></i> Роль
                            </label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="role" id="roleStudent" value="STUDENT" checked>
                                    <label class="form-check-label" for="roleStudent">Студент</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="role" id="roleTeacher" value="TEACHER">
                                    <label class="form-check-label" for="roleTeacher">Преподаватель</label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock me-1"></i> Пароль
                                </label>
                                <div class="form-icon">
                                    <i class="bi bi-lock"></i>
                                    <input type="password" id="password" name="password" class="form-control" required>
                                </div>
                                <div class="form-text">Минимум 7 символов</div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="confirmPassword" class="form-label">
                                    <i class="bi bi-lock-fill me-1"></i> Подтверждение
                                </label>
                                <div class="form-icon">
                                    <i class="bi bi-lock"></i>
                                    <input type="password" id="confirmPassword" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-register w-100 mb-4">
                            <i class="bi bi-person-plus me-2"></i> Зарегистрироваться
                        </button>

                        <div class="divider">
                            <span>Уже есть аккаунт?</span>
                        </div>

                        <div class="text-center">
                            <a href="/auth/login" class="login-link">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Войти
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="/js/auth.js"></script>
<script src="/js/registration.js"></script>
</body>
</html>
