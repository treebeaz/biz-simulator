<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-check-label {
            margin-left: 5px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center mb-4">Регистрация</h2>

            <form id="registerForm">
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">Логин *</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                        <div class="form-text">Только буквы и цифры, минимум 5 символов</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                </div>


                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">Имя *</label>
                        <input type="text" id="firstName" name="firstName" class="form-control" required>
                        <div class="form-text">Начинается с заглавной буквы</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Фамилия *</label>
                        <input type="text" id="lastName" name="lastName" class="form-control" required>
                        <div class="form-text">Начинается с заглавной буквы</div>
                    </div>
                </div>


                <div class="mb-3">
                    <label for="birthDate" class="form-label">Дата рождения *</label>
                    <input type="date" id="birthDate" name="birthDate" class="form-control" required>
                </div>


                <div class="mb-3">
                    <label class="form-label">Роль *</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="role" id="roleStudent" value="STUDENT" checked>
                        <label class="form-check-label" for="roleStudent">Студент</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="role" id="roleTeacher" value="TEACHER">
                        <label class="form-check-label" for="roleTeacher">Преподаватель</label>
                    </div>
                </div>


                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Пароль *</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                        <div class="form-text">Минимум 7 символов</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">Подтвердите пароль *</label>
                        <input type="password" id="confirmPassword" class="form-control" required>
                    </div>
                </div>


                <div id="errorMessage" class="alert alert-danger d-none"></div>
                <div id="successMessage" class="alert alert-success d-none"></div>

                <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>

            <div class="mt-3 text-center">
                <a href="/auth/login">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</div>


<script src="/js/auth.js"></script>
<script src="/js/registration.js"></script>
</body>
</html>
